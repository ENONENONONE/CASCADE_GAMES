# THE FOLD at https://start.cascade.training — the nginx alternative to deploy/Caddyfile, for a Vita that already runs nginx.
# Certificates from certbot: `certbot --nginx -d start.cascade.training` after this file is in place and the http block answers.
# Install: copy to /etc/nginx/sites-available/start.cascade.training, link into sites-enabled, `nginx -t && systemctl reload nginx`.

# Cache-Control by path, set once at the server level (an add_header inside a location would drop the headers set outside it).
# The page, the service worker and every script come fresh: the worker's own cache does the offline copy. three.js r128 never
# changes under its name.
map $uri $fold_cache {
    default               "no-cache";
    ~^/vendor/            "public, max-age=31536000, immutable";
    ~*\.(png|svg)$        "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name start.cascade.training;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name start.cascade.training;

    ssl_certificate     /etc/letsencrypt/live/start.cascade.training/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/start.cascade.training/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/fold/cascade_ar;
    index index.html;
    access_log /var/log/nginx/start.cascade.training.log;

    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json image/svg+xml;
    types { application/manifest+json webmanifest; }

    add_header Cache-Control $fold_cache always;
    add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'" always;
    server_tokens off;

    # The parts' notes, demos and checks stay off the public site.
    location ~ ^/parts/[^/]+/(notes\.md|demo\.html|check\.js|test\.js)$ { return 404; }

    # THE LEDGER (deploy/ledger): the node service on localhost, the same origin as the page.
    location /ledger { proxy_pass http://127.0.0.1:8257; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    location / { try_files $uri $uri/ =404; }
}
